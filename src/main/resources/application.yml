spring:
  application:
    name: pet360

  datasource:
    url: jdbc:h2:mem:pet360;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: simple
    cache-names: pets,tutores,clinicas,consultas,vacinas,medicamentos,agendamentos,alertas,telemetrias,auditorias

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:petcare360-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:petcare360-github-secret}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:petcare360-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:petcare360-google-secret}
            scope:
              - openid
              - profile
              - email

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

pet360:
  jwt:
    secret: "Y2hhbGxlbmdlLWZpYXAtcGV0MzYwLWFkdmFuY2VkLWphdmEtMjAyNi1zZWNyZXQta2V5LXdpdGgtMjU2LWJpdHM="
    expiration-ms: 86400000
  cors:
    allowed-origins: "*"

logging:
  level:
    root: INFO
    br.com.fiap.pet360: DEBUG
    org.hibernate.SQL: DEBUG
