<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | PetCare 360 — CLYVO VET'">PetCare 360</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-petcare shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-heart-pulse-fill text-warning fs-4"></i>
            <span>PetCare 360</span>
            <span class="badge bg-light text-dark ms-1 fw-semibold" style="font-size: 0.65rem;">CLYVO 2026</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPetCare">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarPetCare">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i><span th:text="#{nav.dashboard}">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pets}">
                        <i class="bi bi-heart-fill me-1"></i><span th:text="#{nav.pets}">Pets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tutores}">
                        <i class="bi bi-people-fill me-1"></i><span th:text="#{nav.tutors}">Tutores</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clinicas}">
                        <i class="bi bi-hospital-fill me-1"></i><span th:text="#{nav.clinics}">Clínicas</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold text-warning" th:href="@{/agendamentos/novo}">
                        <i class="bi bi-calendar2-plus-fill me-1"></i><span th:text="#{nav.triage}">Triagem & Agenda</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'VETERINARIO')">
                    <a class="nav-link fw-semibold text-info" th:href="@{/atendimento/fila}">
                        <i class="bi bi-clipboard2-pulse-fill me-1"></i><span th:text="#{nav.clinical_queue}">Fila Clínica</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" style="color: #a7f3d0;" th:href="@{/ia-telemetria}">
                        <i class="bi bi-cpu-fill me-1"></i><span th:text="#{nav.ai_telemetry}">Copiloto IA & IoT</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" style="color: #fde68a;" th:href="@{/integracao}">
                        <i class="bi bi-diagram-3-fill me-1"></i><span th:text="#{nav.integration}">Hub Multidisciplinar</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/alertas}">
                        <i class="bi bi-bell-fill me-1"></i><span th:text="#{nav.alerts}">Alertas</span>
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <div class="btn-group btn-group-sm me-1" role="group" aria-label="Idioma / Language">
                    <a th:href="@{''(lang='pt_BR')}" class="btn btn-outline-light fw-semibold" title="Português (Brasil)">PT</a>
                    <a th:href="@{''(lang='en')}" class="btn btn-outline-light fw-semibold" title="English">EN</a>
                </div>
                <span class="text-white-50 small d-none d-md-inline">
                    <i class="bi bi-person-circle me-1 text-white"></i>
                    <strong class="text-white" sec:authentication="name">usuario</strong>
                    <span class="badge bg-warning text-dark ms-1" sec:authentication="principal.authorities">ROLE</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i><span th:text="#{nav.logout}">Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
